name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Pinned exact: Node 22.23.0 has an http.Agent keep-alive regression
          # that makes firebase-tools' Google auth calls throw "Premature
          # close", breaking Firebase deploys. Fixed in 22.23.1.
          # See nodejs/node#63989.
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: source/app/package-lock.json

      - name: Install dependencies
        working-directory: source/app
        run: npm ci

      - name: Build
        working-directory: source/app
        env:
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_SHEET_ID: ${{ secrets.VITE_SHEET_ID }}
          VITE_ORG_NAME: ${{ secrets.VITE_ORG_NAME }}
        run: npm run build

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ST_MINA_GYM_APP }}
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          channelId: "live"
          entryPoint: source
