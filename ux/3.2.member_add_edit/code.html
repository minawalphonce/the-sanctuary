<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add/Edit Member | St. Mary's Youth</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                    "on-tertiary-fixed-variant": "#50462b",
                    "on-secondary-fixed": "#261900",
                    "on-secondary": "#ffffff",
                    "primary-fixed-dim": "#b7c7eb",
                    "on-secondary-container": "#785a1a",
                    "on-background": "#191c1d",
                    "inverse-on-surface": "#f0f1f2",
                    "error": "#ba1a1a",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .form-input-focus:focus {
            outline: none;
            border-color: #775a19;
            box-shadow: 0 0 0 1px #775a19;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface font-body-md text-on-surface min-h-screen pb-24">
<!-- Top Navigation Bar -->
<header class="bg-surface sticky top-0 z-50 flex items-center justify-between px-edge-margin h-16 w-full border-b border-outline-variant">
<div class="flex items-center gap-3">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-high transition-colors active:opacity-80">
<span class="material-symbols-outlined text-primary" data-icon="close">close</span>
</button>
<h1 class="font-headline-md text-headline-md font-extrabold text-primary">Add Member</h1>
</div>
<div class="flex items-center gap-2">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest px-3 py-1 bg-surface-container-high rounded-full">New Entry</span>
</div>
</header>
<main class="max-w-2xl mx-auto px-edge-margin pt-section-padding">
<!-- Profile Section -->
<section class="flex flex-col items-center mb-10">
<div class="relative group">
<div class="w-32 h-32 rounded-full border-4 border-surface-container-highest bg-surface-container-low flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-outline text-5xl" data-icon="person">person</span>
</div>
<button class="absolute bottom-0 right-0 bg-primary text-white p-2 rounded-full shadow-lg border-2 border-surface active:scale-95 transition-transform">
<span class="material-symbols-outlined text-xl" data-icon="add_a_photo">add_a_photo</span>
</button>
</div>
<p class="mt-4 font-label-caps text-label-caps text-on-surface-variant">UPLOAD MEMBER PHOTO</p>
</section>
<!-- Form Groups -->
<form class="space-y-8">
<!-- Basic Information -->
<div class="space-y-4">
<h3 class="font-title-sm text-title-sm text-secondary border-b border-outline-variant pb-2 flex items-center gap-2">
<span class="material-symbols-outlined text-lg" data-icon="id_card">id_card</span>
                    Identity Details
                </h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="flex flex-col gap-1">
<label class="font-label-caps text-label-caps text-on-surface-variant px-1">FULL NAME</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 font-body-md form-input-focus" placeholder="e.g. Samuel Markos" type="text"/>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-caps text-label-caps text-on-surface-variant px-1">ID NUMBER</label>
<div class="flex items-center bg-surface-container-highest border border-outline-variant rounded-lg px-3 py-3 opacity-70">
<span class="font-body-md text-on-surface-variant select-none">SMY-2024-8842</span>
<span class="material-symbols-outlined text-sm ml-auto" data-icon="lock">lock</span>
</div>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-caps text-label-caps text-on-surface-variant px-1">GYM CLASS</label>
<select class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 font-body-md form-input-focus appearance-none">
<option>Class A</option>
<option>Class B</option>
<option>Class C</option>
</select>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-caps text-label-caps text-on-surface-variant px-1">BIRTHDAY</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 font-body-md form-input-focus" type="date"/>
</div>
</div>
</div>
<!-- Contact Information -->
<div class="space-y-4">
<h3 class="font-title-sm text-title-sm text-secondary border-b border-outline-variant pb-2 flex items-center gap-2">
<span class="material-symbols-outlined text-lg" data-icon="contact_page">contact_page</span>
                    Communication
                </h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="flex flex-col gap-1">
<label class="font-label-caps text-label-caps text-on-surface-variant px-1">MOBILE NUMBER</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 font-body-md form-input-focus" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-caps text-label-caps text-on-surface-variant px-1">EMAIL ADDRESS</label>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 font-body-md form-input-focus" placeholder="name@example.com" type="email"/>
</div>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-caps text-label-caps text-on-surface-variant px-1">HOME ADDRESS</label>
<textarea class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 font-body-md form-input-focus" placeholder="123 Church Way, St. Mary City" rows="2"></textarea>
</div>
</div>
<!-- Social Media -->
<div class="space-y-4">
<h3 class="font-title-sm text-title-sm text-secondary border-b border-outline-variant pb-2 flex items-center gap-2">
<span class="material-symbols-outlined text-lg" data-icon="share">share</span>
                    Social Presence
                </h3>
<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
<div class="flex flex-col gap-1">
<div class="flex items-center gap-2 px-1">
<span class="material-symbols-outlined text-sm text-on-surface-variant" data-icon="chat">chat</span>
<label class="font-label-caps text-label-caps text-on-surface-variant">WHATSAPP</label>
</div>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 font-body-md form-input-focus" placeholder="Username" type="text"/>
</div>
<div class="flex flex-col gap-1">
<div class="flex items-center gap-2 px-1">
<span class="material-symbols-outlined text-sm text-on-surface-variant" data-icon="camera">camera</span>
<label class="font-label-caps text-label-caps text-on-surface-variant">INSTAGRAM</label>
</div>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 font-body-md form-input-focus" placeholder="@handle" type="text"/>
</div>
<div class="flex flex-col gap-1">
<div class="flex items-center gap-2 px-1">
<span class="material-symbols-outlined text-sm text-on-surface-variant" data-icon="videocam">videocam</span>
<label class="font-label-caps text-label-caps text-on-surface-variant">TIKTOK</label>
</div>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg p-3 font-body-md form-input-focus" placeholder="@handle" type="text"/>
</div>
</div>
</div>
<!-- Emergency Contact -->
<div class="p-6 bg-surface-container border border-outline-variant rounded-xl space-y-4">
<h3 class="font-title-sm text-title-sm text-primary flex items-center gap-2">
<span class="material-symbols-outlined text-lg" data-icon="emergency_home">emergency_home</span>
                    Emergency Contact
                </h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="flex flex-col gap-1">
<label class="font-label-caps text-label-caps text-on-surface-variant px-1">CONTACT NAME</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg p-3 font-body-md form-input-focus" placeholder="Full Name" type="text"/>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-caps text-label-caps text-on-surface-variant px-1">RELATION</label>
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg p-3 font-body-md form-input-focus appearance-none">
<option>Parent</option>
<option>Sibling</option>
<option>Guardian</option>
<option>Other</option>
</select>
</div>
<div class="md:col-span-2 flex flex-col gap-1">
<label class="font-label-caps text-label-caps text-on-surface-variant px-1">EMERGENCY NUMBER</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg p-3 font-body-md form-input-focus" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
</div>
</form>
<div class="mt-12 flex items-center justify-between">
<button class="text-error font-body-md underline active:opacity-60 transition-opacity">
                Remove Member Entry
            </button>
<p class="text-caption font-caption text-on-surface-variant italic">Last modified: June 12, 2024</p>
</div>
</main>
<!-- Fixed Footer Action -->
<div class="fixed bottom-0 left-0 w-full p-4 bg-surface-container-lowest border-t border-outline-variant shadow-[0px_-4px_20px_rgba(27,43,72,0.08)] z-50 flex justify-center">
<button class="w-full max-w-lg bg-primary text-on-primary py-4 rounded-full font-title-sm text-title-sm active:scale-[0.98] transition-all hover:bg-primary-container hover:text-on-primary-container flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="save">save</span>
            Save Member
        </button>
</div>
<!-- Background Illustration / Watermark -->
<div class="fixed top-24 right-4 opacity-5 pointer-events-none -z-10">
<img class="w-96 h-96 object-contain" data-alt="A highly detailed and reverent digital illustration of a Coptic Orthodox cross icon, featuring intricate geometric interlacing and gold leaf textures. The artwork is set against a clean, minimalist light-mode background with soft shadows, embodying a corporate yet sacred administrative aesthetic. The lighting is bright and ethereal, emphasizing the precision and holiness of the church environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA5gM4ZCn0Vl9eUXczUiwpai_kJTEb5pGWP1ctvLRpfObf2SfC7zIzDo8Hju5UItzVlgV9_Vo9E5dGTh0s2JjS3ADivwxEH9khALrHCGIozp72J0_5TaACyerVlb_NelsH6rkQxVbiHZHZiE3B8zBLW6oJzPtuFAPNm1aRpSV6TAJ71cPMoyhJ43zcp9VFV9pbich9d4ab3o-frh5nrmM-LknHRvt9Xynp6dxxatTx5idpjmxQAYkSdrtmHFQaaQUblEfV2BVUsfMQ"/>
</div>
